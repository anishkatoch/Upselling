[project]
name = "upsell-poc"
version = "0.1.0"
description = "Speaker diarization, mood and upsell detection for sales recordings"
authors = [
    { name = "anishkatoch-dot", email = "anish.katoch@appinventiv.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic[bedrock]>=1.13.0",
    "boto3>=1.43.111",
    "fastapi>=0.143.0",
    "numpy>=2.3",
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
upsell-poc = "upsell_poc.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
    "types-pyyaml",
    "boto3-stubs[s3,transcribe]",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
