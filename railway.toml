# Railway: build the Dockerfile, check /health, restart if it crashes.
# Needs a Volume mounted at /app/data (recordings, accounts and learned words live there) and the variables in docs/railway.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
